    <path d="M18 58V36c0-12 7-20 17-20s17 8 17 20v22M35 58V39c0-12 7-20 17-20s16 8 16 20v19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="43" cy="60" r="4" fill="#dfffee"/>
    <text x="106" y="54" fill="#f7f7ff" font-size="32" font-weight="800" font-family="Inter,Arial,sans-serif">Mellow Commons</text>
  </g>
