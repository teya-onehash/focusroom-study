    <text y="145" fill="#bdb5ff" font-size="62" font-weight="850" letter-spacing="-2" font-family="Inter,Arial,sans-serif">Grow at your pace.</text>
    <text y="203" fill="#adb5c9" font-size="23" font-family="Inter,Arial,sans-serif">Live focus rooms · social study · real progress</text>
  </g>
  <g transform="translate(790 116)" filter="url(#softShadow)">
    <rect width="338" height="398" rx="38" fill="#141827" fill-opacity=".92" stroke="#fff" stroke-opacity=".14"/>
    <text x="30" y="50" fill="#69dfb1" font-size="13" font-weight="800" letter-spacing="3" font-family="Inter,Arial,sans-serif">STUDYING NOW</text>
    <text x="30" y="90" fill="#fff" font-size="27" font-weight="800" font-family="Inter,Arial,sans-serif">Deep Focus</text>
    <g transform="translate(30 118)">
      <rect width="132" height="105" rx="22" fill="#282443"/>
      <circle cx="66" cy="48" r="26" fill="#7461ef"/>
      <circle cx="66" cy="48" r="18" fill="#a99cff"/>
      <text x="20" y="91" fill="#e9e7ff" font-size="12" font-family="Inter,Arial,sans-serif">Reading notes</text>
    </g>
    <g transform="translate(176 118)">
      <rect width="132" height="105" rx="22" fill="#173530"/>
      <circle cx="66" cy="48" r="26" fill="#319e7d"/>
      <circle cx="66" cy="48" r="18" fill="#65dfb1"/>
      <text x="20" y="91" fill="#e3fff5" font-size="12" font-family="Inter,Arial,sans-serif">Problem set</text>
    </g>
    <g transform="translate(30 238)">
