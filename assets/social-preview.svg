<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Mellow Commons</title>
  <desc id="description">Focus together. Grow at your pace.</desc>
  <defs>
    <linearGradient id="background" x1="74" y1="28" x2="1110" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#171329"/><stop offset=".52" stop-color="#090b13"/><stop offset="1" stop-color="#09221e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7adff"/><stop offset=".52" stop-color="#7461ef"/><stop offset="1" stop-color="#55d7ad"/></linearGradient>
    <radialGradient id="violetGlow"><stop stop-color="#806cf4" stop-opacity=".38"/><stop offset="1" stop-color="#806cf4" stop-opacity="0"/></radialGradient>
    <radialGradient id="mintGlow"><stop stop-color="#55d7ad" stop-opacity=".25"/><stop offset="1" stop-color="#55d7ad" stop-opacity="0"/></radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="166" cy="60" r="320" fill="url(#violetGlow)"/>
  <circle cx="1100" cy="610" r="390" fill="url(#mintGlow)"/>
  <g transform="translate(76 70)">
